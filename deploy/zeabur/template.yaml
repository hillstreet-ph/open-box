apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Open-Box
spec:
  description: Open-Box file and storage gateway, powered by the OpenList engine.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Public domain
      description: Domain that Zeabur should bind to Open-Box.
    - key: DB_DSN
      type: STRING
      name: Scoped Supabase database DSN
      description: Enter the secret-store DSN for open-platform with sslmode=require and search_path=open_box; never commit it.
  tags:
    - Tool
    - Storage
  readme: |-
    # Open-Box

    This template deploys the stateful Open-Box service. It persists runtime data at
    `/opt/openlist/data` and connects directly to the `open_box` schema in Supabase
    Postgres. Do not attach a second empty database or reuse the production database
    for a staging instance. Verify `current_schema()` returns `open_box` before startup.
  services:
    - name: Open-Box
      template: PREBUILT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: hillstreet/open-box:latest
        ports:
          - id: web
            port: 5244
            type: HTTP
        volumes:
          - id: open-box-data
            dir: /opt/openlist/data
        env:
          PORT:
            default: "5244"
          SITE_URL:
            default: https://${PUBLIC_DOMAIN}
          TZ:
            default: Asia/Manila
          UMASK:
            default: "022"
          DB_TYPE:
            default: postgres
          DB_DSN:
            default: ${DB_DSN}
          DB_TABLE_PREFIX:
            default: x_
