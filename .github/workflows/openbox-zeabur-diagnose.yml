name: Open-Box Zeabur Diagnostics (read-only)

# Read-only inspection of what the production Zeabur service actually is and
# what artifact it builds. Added because the promotion run failed on a null
# `service get` and because the service rebuilds itself without any action
# from CI, which contradicts the "prebuilt image runtime" note in
# deploy/CONFIG_MAP.md.
#
# This workflow performs no write: no redeploy, no tag update, no variable
# change. Every payload passes a redaction filter first, so environment
# values, DSNs, passwords and tokens never reach the run log.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to inspect (blank uses ZEABUR_PROJECT_ID)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: openbox-zeabur-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZEABUR_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
      PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
      INPUT_PROJECT_ID: ${{ inputs.project_id }}
      SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
      ORIGIN_URL: ${{ vars.ORIGIN_URL || 'https://open-box-space.zeabur.app' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://open-box.space' }}
      # Environment values are never printed. Any {key, value} pair — the shape
      # Zeabur uses for service variables — has its value blanked outright, and
      # any field whose own name looks like a credential is blanked too, so the
      # shape of a response stays readable without leaking configuration.
      REDACT: >-
        walk(if type=="object" then
        with_entries(if (.key|ascii_downcase|test("secret|password|token|dsn|credential|api[_-]?key|private[_-]?key|access[_-]?key|authorization|cookie|connectionstring"))
        then .value="<redacted>" else . end)
        | if (has("key") and has("value")) then .value="<redacted>" else . end
        else . end)

    steps:
      - name: Authenticate and install the JSON helper
        run: |
          set -euo pipefail
          [ -n "$ZEABUR_TOKEN" ] || { echo "::error::ZEABUR_API_TOKEN is not set"; exit 1; }
          # The Zeabur CLI returns PascalCase objects and prefixes some responses
          # with colored INFO lines, which breaks jq. Drop the preamble first.
          cat > /tmp/zbjson <<'HELPER'
          #!/usr/bin/env bash
          sed -e 's/\x1b\[[0-9;]*m//g' | awk '!seen && /^[{[]/ {seen=1} seen'
          HELPER
          chmod +x /tmp/zbjson
          npx --yes zeabur@latest auth login --token "$ZEABUR_TOKEN" >/dev/null
          echo "### profile"
          npx --yes zeabur@latest profile --interactive=false --auto_check_update=false --json 2>/dev/null \
            | /tmp/zbjson | jq -c "$REDACT" | head -c 800 || echo "profile unavailable"
          echo

      - name: List projects
        run: |
          set -uo pipefail
          echo "### projects"
          npx --yes zeabur@latest project list --interactive=false --auto_check_update=false --json 2>/dev/null \
            | /tmp/zbjson | jq -c '(.[]? // .projects[]?) | {id: (.id // .ID), name: (.name // .Name)}' \
            | head -25 || echo "project list unavailable"

      - name: Enumerate services in the project
        id: services
        run: |
          set -uo pipefail
          pid="${INPUT_PROJECT_ID:-$PROJECT_ID}"
          echo "### services under project $pid"
          npx --yes zeabur@latest service list --project-id "$pid" --interactive=false --auto_check_update=false --json 2>/dev/null \
            | /tmp/zbjson > services.json
          jq -r "$REDACT" services.json | head -80
          ids=$(jq -r '(.[]? // .services[]?) | .ID // .id' services.json 2>/dev/null | paste -sd' ' -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          names=$(jq -r '(.[]? // .services[]?) | [(.ID // .id), (.Name // .name), .Template] | @tsv' services.json 2>/dev/null)
          {
            echo "### services in \`$pid\`"
            echo '```'
            echo "$names"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect every service (instruction, domains, deployments)
        env:
          SERVICE_IDS: ${{ steps.services.outputs.ids }}
        run: |
          set -uo pipefail
          for sid in ${SERVICE_IDS:-$SERVICE_ID}; do
            echo "=============================================="
            echo "### service $sid"
            echo "--- instruction (what the platform thinks this service is)"
            npx --yes zeabur@latest service instruction --id "$sid" --interactive=false --auto_check_update=false --json 2>/dev/null \
              | /tmp/zbjson | jq -c "$REDACT" | head -c 1500 || echo "instruction unavailable"
            echo
            echo "--- domains"
            npx --yes zeabur@latest domain list --id "$sid" --interactive=false --auto_check_update=false --json 2>/dev/null \
              | /tmp/zbjson | jq -c "$REDACT" | head -c 1200 || echo "domain list unavailable"
            echo
            echo "--- network"
            npx --yes zeabur@latest service network --id "$sid" --interactive=false --auto_check_update=false --json 2>/dev/null \
              | /tmp/zbjson | jq -c "$REDACT" | head -c 1200 || echo "network unavailable"
            echo
            echo "--- recent deployments"
            npx --yes zeabur@latest deployment list --service-id "$sid" --interactive=false --auto_check_update=false --json 2>/dev/null \
              | /tmp/zbjson | jq -c "$REDACT" | head -6 || echo "deployment list unavailable"
            echo
          done

      - name: Record what the edge and the origin are serving
        run: |
          set -uo pipefail
          echo "### origin $ORIGIN_URL"
          curl -sS --max-time 20 "$ORIGIN_URL/api/public/settings" 2>/dev/null \
            | jq -r '.data.version // "no version"' || echo "origin settings unavailable"
          echo "### edge $SITE_URL"
          curl -sS --max-time 20 "$SITE_URL/api/public/settings" 2>/dev/null \
            | jq -r '.data.version // "no version"' || echo "edge settings unavailable"
          printf 'served entry assets: '
          curl -sS --max-time 20 "$SITE_URL/" 2>/dev/null \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | paste -sd' ' - || echo none
          echo
          printf 'PAT discriminator reply: '
          curl -sS --max-time 20 -X POST "$ORIGIN_URL/api/fs/list" \
            -H 'Authorization: obk_readonly_probe' -H 'Content-Type: application/json' \
            -d '{"path":"/","page_number":1,"page_size":1}' 2>/dev/null | head -c 120 || echo none
          echo
          printf 'PAT route exists (expect JSON, not HTML): '
          curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{content_type}\n' \
            "$ORIGIN_URL/api/me/token/list" -H 'Authorization: Bearer none' || echo unreachable

      - name: Write the summary
        run: |
          set -uo pipefail
          {
            echo "### Open-Box Zeabur diagnostics"
            echo "- configured project: \`${INPUT_PROJECT_ID:-$PROJECT_ID}\`"
            echo "- promotion service id: \`${SERVICE_ID}\`"
            echo "- writes performed: none"
            echo
            echo "Compare the services above against the domains and the build stamp the origin"
            echo "serves. Promotion pins an image tag only on the service that owns"
            echo "\`open-box-space.zeabur.app\`."
          } >> "$GITHUB_STEP_SUMMARY"
