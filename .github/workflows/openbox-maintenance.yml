name: Open-Box Maintenance

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Production smoke
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://open-box.space' }}
        run: |
          set -euo pipefail
          URL="${SITE_URL%/}"
          code=$(curl -sS -o /tmp/p -w "%{http_code}" "$URL/ping" || true)
          body=$(cat /tmp/p || true)
          echo "ping=$code body=$body"
          test "$code" = "200"
          test "$body" = "pong"

      - name: Settings check
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://open-box.space' }}
        run: |
          set -euo pipefail
          URL="${SITE_URL%/}"
          curl --fail-with-body -sS "$URL/api/public/settings" | tee /tmp/settings.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/settings.json"))
          assert d.get("code")==200
          title=(d.get("data") or {}).get("site_title","")
          print("site_title", title)
          PY

  backup-db:
    runs-on: ubuntu-latest
    needs: health
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF is required"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          canonical_ref = "huadtiuuoiriqrjpjxhr"
          project_ref = os.environ["SUPABASE_PROJECT_REF"].strip()
          dsn = os.environ["SUPABASE_DB_URL"].strip()
          if dsn.count("@") != 1:
              raise SystemExit("::error::SUPABASE_DB_URL contains ambiguous connection authority")
          if "#" in dsn:
              raise SystemExit("::error::SUPABASE_DB_URL must not contain a fragment delimiter")
          parsed = urlparse(dsn)
          username = unquote(parsed.username or "")
          database_path = parsed.path

          if project_ref != canonical_ref:
              raise SystemExit("::error::SUPABASE_PROJECT_REF is not the canonical Open-Box project")
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("::error::SUPABASE_DB_URL must be a PostgreSQL connection URI")
          if not parsed.hostname or not database_path:
              raise SystemExit("::error::SUPABASE_DB_URL must include a remote host and database")
          if parsed.query or parsed.params or parsed.fragment:
              raise SystemExit("::error::SUPABASE_DB_URL must not contain target-overriding URI parameters")
          if database_path != "/postgres":
              raise SystemExit("::error::SUPABASE_DB_URL must target the canonical postgres database")

          direct_host = f"db.{canonical_ref}.supabase.co"
          is_direct = parsed.hostname == direct_host and username == "postgres"
          is_pooler = parsed.hostname.endswith(".pooler.supabase.com") and username == f"postgres.{canonical_ref}"
          if not (is_direct or is_pooler):
              raise SystemExit("::error::SUPABASE_DB_URL is not an approved canonical Open-Box direct or pooler URI")
          print("Supabase backup connection reference validated")
          PY

      - name: Dump and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/openbox-db-backup.sh

      # Same script as the nightly backup: the two copies had drifted, and this
      # one wrote no manifest, so maintenance archives reached Storage with no
      # checksum to verify a restore against.
      - name: Ensure bucket + upload archive and manifest
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash .github/scripts/openbox-storage-upload.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: openbox-maintenance-backup
          path: |
            *.sql.gz
            *.manifest.json
          retention-days: 14
