name: Open-Box Deploy (Zeabur)

# RETIRED — do not run. The Zeabur runtime stopped serving
# `open-box-space.zeabur.app` on 2026-11-02 (issue #87) and the operator directed
# the production runtime to move to Railway (issue #28). The delivery path is now
# `.github/workflows/openbox-deploy-railway.yml`, the runbook is
# `deploy/railway/README.md`, and the first step of this job refuses every run so
# a stale habit cannot write to a dead platform. This file is kept for the gate
# history it encodes; deleting it would lose that.

# Promotion of an already-built Docker Hub image to the production Zeabur
# service, followed by the live production gate recorded in deploy/PRODUCTION.md
# (item 4: immutable image, health, database connectivity, login, storage,
# domain/TLS, restart recovery).
#
# Preconditions that this workflow deliberately refuses to assume:
#   * docs/PLATFORM_BACKEND.md states the historically shared Supabase, Docker
#     Hub and Zeabur management tokens were exposed in chat and must be rotated
#     before write-enabled deployment is activated. The operator confirms that
#     rotation here; the workflow never prints the token.
#   * The retired Zeabur project `ymhiwerqyegvondndkjn` must never be targeted.
#     The service ID comes from a repository variable and is echoed before any
#     write so a wrong binding is visible in the run log.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "promote and verify writes the new tag; verify only runs the live gate without any write"
        required: true
        type: choice
        options:
          - "promote and verify"
          - "verify only (no write)"
        default: "promote and verify"
      image_tag:
        description: "Docker Hub tag of hillstreet/open-box to promote (blank keeps the current tag)"
        required: false
        type: string
        default: ""
      expected_frontend_asset:
        description: "Asset name the served index.html must reference (e.g. index-D-qN4CSQ.js); blank skips the frontend identity check"
        required: false
        type: string
        default: ""
      rotate_confirmed:
        description: "Provider management tokens were rotated (docs/PLATFORM_BACKEND.md)"
        required: true
        type: choice
        options:
          - "no — stop"
          - "yes — allow write"
        default: "no — stop"

permissions:
  contents: read

concurrency:
  group: openbox-zeabur-deploy
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://open-box.space' }}
      ORIGIN_URL: ${{ vars.ORIGIN_URL || 'https://open-box-space.zeabur.app' }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'hillstreet' }}
      IMAGE_NAME: open-box
      RETIRED_PROJECT_ID: ymhiwerqyegvondndkjn

    steps:
      - name: Refuse the retired Zeabur runtime
        run: |
          set -euo pipefail
          cat >&2 <<'MSG'
          ::error::This workflow targets the retired Zeabur runtime, which stopped
          serving on 2026-11-02. Production promotion now runs
          .github/workflows/openbox-deploy-railway.yml (runbook:
          deploy/railway/README.md). Nothing below this step has been executed,
          and no Zeabur write was attempted.
          MSG
          exit 1

      - name: Confirm the rotation precondition
        env:
          ROTATE_CONFIRMED: ${{ inputs.rotate_confirmed }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "verify only (no write)" ]; then
            echo "Verify-only run: no Zeabur write will be attempted, so no rotation attestation is required."
            exit 0
          fi
          if [ "$ROTATE_CONFIRMED" != "yes — allow write" ]; then
            echo "::error::Deployment is gated on rotating the previously exposed management tokens (docs/PLATFORM_BACKEND.md). Re-run with rotate_confirmed = 'yes — allow write' after rotation."
            exit 1
          fi
          echo "Rotation confirmed by ${{ github.actor }}."

      - name: Check required bindings
        env:
          ZEABUR_API_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ vars.ZEABUR_PROJECT_ID }}
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
        run: |
          set -euo pipefail
          [ -n "$ZEABUR_API_TOKEN" ] || { echo "::error::ZEABUR_API_TOKEN secret is not set"; exit 1; }
          [ -n "$ZEABUR_PROJECT_ID" ] || { echo "::error::ZEABUR_PROJECT_ID variable is not set"; exit 1; }
          [ -n "$ZEABUR_SERVICE_ID" ] || { echo "::error::ZEABUR_SERVICE_ID variable is not set"; exit 1; }
          if [ "$ZEABUR_PROJECT_ID" = "$RETIRED_PROJECT_ID" ]; then
            echo "::error::ZEABUR_PROJECT_ID points at the retired project; refusing."
            exit 1
          fi
          echo "Target project=$ZEABUR_PROJECT_ID service=$ZEABUR_SERVICE_ID"

      - name: Resolve the immutable image digest
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG:-latest}"
          if [ "$tag" != "$(printf '%s' "$tag" | tr -dc 'A-Za-z0-9._+-')" ] || [ "${#tag}" -gt 128 ]; then
            echo "::error::image_tag must be a plain Docker tag (letters, digits, . _ + -)"
            exit 1
          fi
          json=$(curl -fsSL --max-time 20 "https://hub.docker.com/v2/repositories/$DOCKERHUB_NAMESPACE/$IMAGE_NAME/tags/$tag")
          digest=$(echo "$json" | jq -r '.digest // empty')
          pushed=$(echo "$json" | jq -r '.last_updated // empty')
          if [ -z "$digest" ]; then
            echo "::error::$DOCKERHUB_NAMESPACE/$IMAGE_NAME:$tag has no manifest on Docker Hub"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoting $DOCKERHUB_NAMESPACE/$IMAGE_NAME:$tag"
          echo "  digest: $digest"
          echo "  pushed: $pushed"

      - name: Capture the current state (rollback reference)
        env:
          ZEABUR_API_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
        run: |
          set -euo pipefail
          # The Zeabur CLI prefixes some JSON responses with colored INFO lines.
          zbjson() { sed -e 's/\x1b\[[0-9;]*m//g' | awk '!seen && /^[{[]/ {seen=1} seen'; }
          npx --yes zeabur@latest auth login --token "$ZEABUR_API_TOKEN" >/dev/null
          # Responses are PascalCase (ID, Name, Project.ID, Template), so the old
          # lowercase reads produced a row of nulls and looked like a bad binding.
          npx --yes zeabur@latest service get --id "$ZEABUR_SERVICE_ID" --interactive=false --auto_check_update=false --json 2>/dev/null \
            | zbjson > before-service.json
          jq -c '{id: (.ID // .uid), name: (.Name // .name), projectID: (((.Project // {}) | (.ID // .id)) // .projectID), template: .Template}' before-service.json
          npx --yes zeabur@latest deployment get --service-id "$ZEABUR_SERVICE_ID" --interactive=false --auto_check_update=false --json 2>/dev/null \
            | zbjson > before-deployment.json || echo '{}' > before-deployment.json
          echo "previous deployment state: $(jq -r '(.State // .state // .Status // .status // "unknown")' before-deployment.json)"
          # Refuse to pin a service that does not own the origin hostname: this
          # project also contains a second prebuilt service, open-box-next.
          origin_host=$(printf '%s' "$ORIGIN_URL" | sed -e 's#^https\?://##' -e 's#/.*$##')
          npx --yes zeabur@latest domain list --id "$ZEABUR_SERVICE_ID" --interactive=false --auto_check_update=false --json 2>/dev/null \
            | zbjson > before-domains.json || echo '[]' > before-domains.json
          if ! grep -q "$origin_host" before-domains.json; then
            echo "::error::service $ZEABUR_SERVICE_ID does not list the origin host $origin_host; promotion stopped before any write."
            echo "domains on this service: $(head -c 400 before-domains.json)"
            exit 1
          fi
          echo "origin host $origin_host is bound to this service"
          echo "$ORIGIN_URL" >/dev/null
          # The origin is exactly what is broken during an outage, so reading it
          # must not abort the run: the promotion is the recovery action, and it
          # has to be allowed to reach the write step.
          before_version=$(curl -fsSL --max-time 20 "$ORIGIN_URL/api/public/settings" 2>/dev/null | jq -r '.data.version // empty' || true)
          echo "before_version=$before_version" >> "$GITHUB_OUTPUT"
          echo "reported before build: ${before_version:-none}"
          # The served entry assets, not the build stamp, are what identifies the
          # artifact: `data.version` is a row in the shared database that
          # open-box-next rewrites whenever it rebuilds against production data.
          # See issue #87.
          before_assets=$(curl -sS --max-time 20 "$ORIGIN_URL/" 2>/dev/null \
            | grep -oE '/assets/index[A-Za-z0-9._-]*\.js' | sort -u | paste -sd' ' - || true)
          echo "before_assets=$before_assets" >> "$GITHUB_OUTPUT"
          echo "served before assets: ${before_assets:-none}"
        id: before

      - name: Trigger the promotion
        if: inputs.mode != 'verify only (no write)'
        env:
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "$IMAGE_TAG" = "latest" ] && [ -z "$INPUT_IMAGE_TAG" ]; then
            echo "Re-pulling the tracked tag without changing it (service redeploy)"
            npx --yes zeabur@latest service redeploy --id "$ZEABUR_SERVICE_ID" --interactive=false --yes
          else
            echo "Pinning the service image tag to $IMAGE_TAG"
            npx --yes zeabur@latest service update tag --id "$ZEABUR_SERVICE_ID" --tag "$IMAGE_TAG" --interactive=false --yes
          fi

      - name: Wait for the service to report ready
        if: inputs.mode != 'verify only (no write)'
        env:
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
          BEFORE_VERSION: ${{ steps.before.outputs.before_version }}
          BEFORE_ASSETS: ${{ steps.before.outputs.before_assets }}
          EXPECTED_FRONTEND_ASSET: ${{ inputs.expected_frontend_asset }}
        run: |
          set -euo pipefail
          zbstate() { sed -e 's/\x1b\[[0-9;]*m//g' | awk '!seen && /^[{[]/ {seen=1} seen' \
                       | jq -r '(.State // .state // .Status // .status // "unknown")' 2>/dev/null; }
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state=$(npx --yes zeabur@latest deployment get --service-id "$ZEABUR_SERVICE_ID" --interactive=false --auto_check_update=false --json 2>/dev/null \
              | zbstate) || state=unknown
            serving=$(curl -fsS --max-time 15 "$ORIGIN_URL/api/public/settings" 2>/dev/null | jq -r '.data.version // empty' || true)
            served_assets=$(curl -sS --max-time 15 "$ORIGIN_URL/" 2>/dev/null \
              | grep -oE '/assets/index[A-Za-z0-9._-]*\.js' | sort -u | paste -sd' ' - || true)
            echo "$(date -u +%H:%M:%S) deployment state: $state | stamp: ${serving:-unreachable} | assets: ${served_assets:-none}"
            case "$state" in
              FAILURE|FAILED|CRASH|CrashLoopBackOff)
                echo "::error::deployment reported $state; inspect with: zeabur deployment log --service-id $ZEABUR_SERVICE_ID"
                exit 1 ;;
            esac
            # A different set of served entry chunks means a different bundle is
            # answering, which the shared build stamp cannot prove on its own.
            if [ -n "$served_assets" ] && [ "$served_assets" != "${BEFORE_ASSETS:-}" ]; then
              echo "The origin now serves a different frontend bundle; the container rolled."
              exit 0
            fi
            if [ -z "${BEFORE_ASSETS:-}" ] && [ -n "$served_assets" ]; then
              echo "The origin answered after serving nothing; the container rolled."
              exit 0
            fi
            case "$state" in
              SUCCESS|READY|Succeeded|succeeded)
                # SUCCESS can still describe the deployment that was already
                # serving, so it only ends the wait when there is nothing named
                # to wait for, or when that named bundle is provably at the
                # origin. Otherwise keep polling until the deadline.
                if [ -z "${EXPECTED_FRONTEND_ASSET:-}" ]; then
                  if [ -n "$served_assets" ]; then
                    echo "deployment reported $state with ${served_assets} served and no named bundle to wait for"
                    exit 0
                  fi
                  echo "deployment reported $state but the origin still serves no entry asset; keep polling"
                else
                  case " $served_assets " in
                    *" $EXPECTED_FRONTEND_ASSET "*|*"/$EXPECTED_FRONTEND_ASSET "*)
                      echo "deployment reported $state and the origin serves the expected $EXPECTED_FRONTEND_ASSET"
                      exit 0 ;;
                    *)
                      echo "deployment reported $state but $EXPECTED_FRONTEND_ASSET is not served yet (serving ${served_assets:-nothing}); keep polling" ;;
                  esac
                fi ;;
            esac
            sleep 20
          done
          echo "::error::the origin never served a frontend bundle that differs from the pre-promotion one within 15 minutes."
          echo "Inspect with: zeabur deployment log --service-id $ZEABUR_SERVICE_ID"
          exit 1

      - name: Production gate — health, PAT routes, database-backed reads, storage, TLS
        env:
          EXPECTED_TAG: ${{ steps.image.outputs.tag }}
          BEFORE_VERSION: ${{ steps.before.outputs.before_version }}
          BEFORE_ASSETS: ${{ steps.before.outputs.before_assets }}
          EXPECTED_FRONTEND_ASSET: ${{ inputs.expected_frontend_asset }}
          VERIFY_ONLY: ${{ inputs.mode == 'verify only (no write)' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::production gate failed: $1"; exit 1; }

          code=$(curl -sS -o /tmp/ping -w "%{http_code}" --max-time 20 "$SITE_URL/ping") || fail "edge /ping unreachable"
          [ "$code" = "200" ] && [ "$(cat /tmp/ping)" = "pong" ] || fail "/ping did not return pong"

          # A PAT-shaped bearer must be answered by the token middleware, not by
          # the legacy session parser. Old binaries reply "token is invalidated";
          # the scoped-token build replies "Invalid or expired access token".
          pat_probe=$(curl -fsS --max-time 20 -X POST "$ORIGIN_URL/api/fs/list" \
            -H 'Authorization: obk_gatecheck' -H 'Content-Type: application/json' \
            -d '{"path":"/","page_number":1,"page_size":1}' || true)
          echo "PAT discriminator reply: ${pat_probe:-<non-200>}"
          case "$pat_probe" in
            *"Invalid or expired access token"*) ;;
            *"token is invalidated"*) fail "the running binary predates scoped personal access tokens" ;;
            *) fail "unexpected PAT discriminator reply" ;;
          esac

          # Unmatched /api paths fall through to the SPA, so a JSON answer proves
          # the token routes exist.
          tok_json=$(curl -sS --max-time 20 "$ORIGIN_URL/api/me/token/list" -H 'Authorization: obk_gatecheck' || true)
          case "$tok_json" in
            *"<html"*|*"<!DOCTYPE"*) fail "/api/me/token/list is not routed (SPA fallback)" ;;
            '{"code"'*) ;;
            *) fail "unexpected /api/me/token/list reply: ${tok_json:0:120}" ;;
          esac

          # Database-backed public settings through the edge (schema + pooler).
          settings=$(curl -fsSL --max-time 20 "$SITE_URL/api/public/settings") || fail "the edge did not answer $SITE_URL/api/public/settings"
          echo "$settings" | jq -e '.data.site_name != null or .data.allow_mounted != null' >/dev/null || fail "public settings payload is empty"
          version=$(echo "$settings" | jq -r '.data.version // empty')
          echo "serving version stamp: ${version:-none} (recorded only — open-box-next rewrites this shared row, so it cannot identify a promotion)"
          # Rollout identity comes from what the origin serves, not from that row.
          served=$(curl -sS --max-time 20 "$ORIGIN_URL/" 2>/dev/null \
            | grep -oE '/assets/index[A-Za-z0-9._-]*\.js' | sort -u | paste -sd' ' - || true)
          echo "origin entry assets: ${served:-none}"
          if [ "$VERIFY_ONLY" = "true" ]; then
            [ -n "$served" ] || fail "the origin serves no frontend entry asset"
            echo "verify-only run: served assets recorded, not compared ($served)"
          else
            [ -n "$served" ] || fail "the origin serves no frontend entry asset; the promoted container is not answering"
            if [ -n "$BEFORE_ASSETS" ] && [ "$served" = "$BEFORE_ASSETS" ]; then
              # Unchanged bytes are only a verdict when a named build can settle
              # it: a backend-only promotion legitimately re-serves the same
              # frontend bundle, so failing here would block honest work.
              if [ -n "$EXPECTED_FRONTEND_ASSET" ]; then
                case " $served " in
                  *" $EXPECTED_FRONTEND_ASSET "*|*"/$EXPECTED_FRONTEND_ASSET "*)
                    echo "::warning::the served bundle is unchanged and already is $EXPECTED_FRONTEND_ASSET — this run proves the frontend identity but not a container roll." ;;
                  *)
                    fail "the origin still serves the pre-promotion bundle ($served) instead of $EXPECTED_FRONTEND_ASSET; the promotion did not roll the container" ;;
                esac
              else
                echo "::warning::the served bundle is unchanged ($served) and no expected_frontend_asset was supplied, so assets alone cannot prove a roll. Re-dispatch with the entry chunk name to make this a hard check."
              fi
            fi
          fi

          # Anonymous listing proves the storage driver and mount table read back.
          ls_json=$(curl -sS --max-time 20 -X POST "$SITE_URL/api/fs/list" -H 'Content-Type: application/json' -d '{"path":"/"}' || true)
          case "$ls_json" in
            '{"code":200'*) ;;
            '{"code":401'*|'{"code":403'*) echo "listing requires auth in this deployment; recorded as expected" ;;
            *) fail "unexpected /api/fs/list reply: ${ls_json:0:120}" ;;
          esac

          # TLS and gateway headers.
          tls=$(curl -sS -o /dev/null -w "%{ssl_verify_result}" --max-time 20 "$SITE_URL/ping")
          [ "$tls" = "0" ] || fail "TLS verification returned $tls"
          curl -sSI --max-time 20 "$SITE_URL/ping" | grep -qi "x-zeabur" || echo "::warning::no x-zeabur header observed at the edge; confirm the Worker still fronts the origin"

          if [ -n "$EXPECTED_FRONTEND_ASSET" ]; then
            # index.html references the legacy and the modern entry chunk, in that
            # order, so the expected build must be found among all served assets.
            edge_assets=$(curl -sS --max-time 20 "$SITE_URL/" \
              | grep -oE "/assets/index[A-Za-z0-9._-]*\.js" | sort -u | paste -sd' ' - || true)
            echo "served entry assets: ${edge_assets:-none}"
            case " $edge_assets " in
              *" $EXPECTED_FRONTEND_ASSET "*|*"/$EXPECTED_FRONTEND_ASSET "*) echo "frontend identity matches the expected build" ;;
              *) fail "served frontend assets do not include $EXPECTED_FRONTEND_ASSET" ;;
            esac
          elif [ "$VERIFY_ONLY" = "false" ]; then
            echo "::warning::expected_frontend_asset was left empty, so the served bundle was compared to the pre-promotion one but not to a named build."
          fi

          echo "Production gate passed for $EXPECTED_TAG."

      - name: Report the running artifact
        if: always()
        env:
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
        run: |
          set -uo pipefail
          after=$(curl -sS --max-time 20 "$ORIGIN_URL/api/public/settings" 2>/dev/null \
            | jq -r '.data.version // "unreachable"' 2>/dev/null || echo unreachable)
          {
            echo "### Open-Box promotion report"
            echo "- mode: \`${{ inputs.mode }}\`"
            echo "- tag: \`${{ steps.image.outputs.tag }}\`"
            echo "- digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- build before: \`${{ steps.before.outputs.before_version }}\`"
            echo "- build after: \`${after}\`"
            echo "- assets before: \`${{ steps.before.outputs.before_assets }}\`"
            echo "- service: \`${{ vars.ZEABUR_PROJECT_ID }}\` / \`${ZEABUR_SERVICE_ID}\`"
            if [ "${{ job.status }}" != "success" ]; then
              echo "- rollback: \`zeabur service update tag --id $ZEABUR_SERVICE_ID --tag <previous tag> --yes\` (volume \`open-box-data\` must be kept)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
