name: Open-Box PR Gate

on:
  pull_request:
    branches: [staging, main, develop]
  workflow_dispatch:
    inputs:
      image:
        description: "Optional immutable hillstreet/open-box image digest to smoke-test"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Risk scan
        id: risk
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50
          RISK=low
          NOTES=""
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'Dockerfile|entrypoint|go.mod|internal/bootstrap' >/dev/null; then
            RISK=high
            NOTES="${NOTES}- Critical paths changed"$'\n'
          fi
          if git diff "origin/${{ github.base_ref }}...HEAD" | grep -E '^\+\s*VOLUME\s' >/dev/null; then
            RISK=blocker
            NOTES="${NOTES}- BLOCKER: Dockerfile reintroduces VOLUME"$'\n'
          fi
          echo "level=$RISK" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$RISK" = "blocker" ]; then
            exit 1
          fi

      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(mktemp)
          cat > "$BODY" << MSG
          ## Open-Box automated gate

          **Risk:** \`${{ steps.risk.outputs.level }}\`

          ${{ steps.risk.outputs.notes }}

          Policy: blocker fails CI. high requires human review plus staging smoke. Never merge upstream-sync branches directly to main.
          MSG
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$BODY" || true

  artifact-grants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate grants and rollback in disposable PostgreSQL
        run: |
          set -euo pipefail
          trap 'docker rm -f openbox-policy-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name openbox-policy-test --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD/supabase:/fixtures:ro" postgres:16 >/dev/null
          for attempt in {1..30}; do
            if docker exec openbox-policy-test pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec openbox-policy-test psql -X -U postgres -v ON_ERROR_STOP=1 \
            -f /fixtures/tests/open_box_effective_artifact_grants.sql

  container-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.image != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise published immutable container
        env:
          OPENBOX_TEST_IMAGE: ${{ inputs.image }}
        run: python3 scripts/smoke-container.py
