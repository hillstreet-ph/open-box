name: Open-Box Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        id: check
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not set — skipping push"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject VOLUME
        if: steps.check.outputs.present == 'true'
        run: |
          if grep -nE '^\s*VOLUME\s' Dockerfile; then
            echo "VOLUME not allowed"
            exit 1
          fi

      - name: Tags
        if: steps.check.outputs.present == 'true'
        id: meta
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/open-box"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # `latest` is a release pointer, and it moves only here — when a
            # version tag is pushed. The live Zeabur service resolves a mutable
            # tag, so every push to main that moved `latest` redeployed
            # production without the gated workflow running: confirmed three
            # times, and confirmed again on 2026-11-01 between 13:19Z and
            # 13:34Z with no `Open-Box Deploy (Zeabur)` run at all in the
            # window (the promotions on main are 12:24Z and 22:19Z on 10-31).
            # A docs-only merge was enough to move it.
            echo "tags=${REPO}:${TAG},${REPO}:latest" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            TAG="main-$(echo ${{ github.sha }} | cut -c1-7)"
            # The immutable per-commit tag is what a promotion dispatches.
            echo "tags=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'
      - uses: docker/login-action@v3
        if: steps.check.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.present == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            FRONTEND_REPO=${{ vars.FRONTEND_REPO || 'OpenListTeam/OpenList-Frontend' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
