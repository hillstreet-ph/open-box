name: Open-Box Upstream Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch (empty = upstream default)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Open-Box Platform Bot"
          git config user.email "open-box-bot@users.noreply.github.com"
          git remote add upstream https://github.com/OpenListTeam/OpenList.git || true
          git fetch upstream --tags --force

      - name: Create upstream-sync branch and PR to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          if [ -n "${UPSTREAM_REF}" ]; then
            REF="$UPSTREAM_REF"
          else
            REF=$(git rev-parse upstream/main 2>/dev/null || git rev-parse upstream/master)
          fi
          SHORT=$(echo "$REF" | cut -c1-7)
          BRANCH="upstream-sync/${DATE}-${SHORT}"
          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            BASE=origin/staging
          else
            BASE=origin/main
          fi
          git checkout -B "$BRANCH" "$BASE"
          if ! git merge "$REF" --no-edit; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort || git reset --hard "$BASE"
            {
              echo "### Upstream synchronization blocked"
              echo
              echo "Merge conflicts must be reconciled deliberately; no branch or PR was pushed."
              echo
              echo "**Upstream ref:** \`${REF}\`"
              echo "**Target base:** \`${BASE}\`"
              echo "**Conflicted paths:**"
              echo '```text'
              printf '%s\n' "$CONFLICTS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream merge has conflicts; merge aborted before commit or push"
            exit 1
          fi
          WORKFLOW_CHANGES=$(git diff --name-only "$BASE"...HEAD -- .github/workflows)
          if [ -n "$WORKFLOW_CHANGES" ]; then
            git reset --hard "$BASE"
            {
              echo "### Upstream synchronization blocked"
              echo
              echo "The upstream merge changes GitHub Actions workflows, which the current token cannot push."
              echo "No branch or PR was pushed and repository permissions were not broadened."
              echo
              echo "**Upstream ref:** \`${REF}\`"
              echo "**Workflow paths:**"
              echo '```text'
              printf '%s\n' "$WORKFLOW_CHANGES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream merge changes workflow files; manual reviewed reconciliation required"
            exit 1
          fi
          if grep -nE '^\s*VOLUME\s' Dockerfile 2>/dev/null; then
            echo "BLOCKER: VOLUME reintroduced in Dockerfile"
            exit 1
          fi
          git push -u origin "$BRANCH" --force-with-lease
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" << BODY
          ## Open-Box upstream synchronization

          **Status:** clean
          **Upstream ref:** \`${REF}\`
          **Target base:** \`staging\` (never main)

          ### Checklist before merge to staging
          - [ ] CI green
          - [ ] Dockerfile remains Railway-safe (no VOLUME)
          - [ ] No destructive DB changes without migration note
          - [ ] Smoke plan for staging

          After staging validation, open a separate PR: staging to main.
          BODY
          gh pr create --base staging --head "$BRANCH" \
            --title "chore(sync): upstream ${REF} (clean)" \
            --body-file "$BODY_FILE" \
            --draft || echo "PR may already exist"
