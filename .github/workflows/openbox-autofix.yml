name: Open-Box Auto Review

on:
  pull_request:
    branches: [staging, main, develop]
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static risk rules
        id: scan
        env:
          # base_ref arrives from the pull_request event. Interpolating it into the
          # script body would let a ref name shape the command line, so it is read
          # from the environment and required to look like a plain branch.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            ''|*[!A-Za-z0-9._/-]*) echo "::error::unexpected base_ref"; exit 1 ;;
          esac
          git fetch origin "$BASE_REF" --depth=50
          RANGE="origin/$BASE_REF...HEAD"
          NOTES=""
          LEVEL=ok
          ADDED_LINES=$(git diff --unified=0 "$RANGE" -- . | grep -E '^\+[^+]' || true)
          if printf '%s\n' "$ADDED_LINES" | grep -E '^\+\s*VOLUME\s' >/dev/null; then
            LEVEL=blocker
            NOTES="${NOTES}- BLOCKER: Dockerfile VOLUME reintroduced"$'\n'
          fi
          if git diff --name-only "$RANGE" | grep -E '(^|/)Dockerfile$' >/dev/null; then
            NOTES="${NOTES}- Dockerfile changed"$'\n'
            LEVEL=review
          fi
          if git diff --name-only "$RANGE" | grep -E 'go.mod|go.sum' >/dev/null; then
            NOTES="${NOTES}- Dependency lockfile changed"$'\n'
            [ "$LEVEL" = "ok" ] && LEVEL=review
          fi
          DESTRUCTIVE_PATTERN='DROP'" "'TABLE|TRUN'"CATE|rm -r"'f'
          # The destructive scan is about what ships: application code, migrations,
          # entrypoints. Workflow files are the one place where deleting a directory
          # is routine maintenance — GitHub runners fill up without it, and the last
          # darwin-arm64 build died pulling the cross toolchain for exactly that
          # reason — so scan everything the image actually contains instead.
          ADDED_SHIPPED_LINES=$(git diff --unified=0 "$RANGE" -- . ':(exclude).github/workflows' | grep -E '^\+[^+]' || true)
          if printf '%s\n' "$ADDED_SHIPPED_LINES" | grep -Ei "$DESTRUCTIVE_PATTERN" >/dev/null; then
            NOTES="${NOTES}- Possible destructive path detected in added lines"$'\n'
            LEVEL=blocker
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$LEVEL" = "blocker" ]; then exit 1; fi
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(mktemp)
          cat > "$BODY" << MSG
          ## Open-Box auto review

          **Level:** \`${{ steps.scan.outputs.level }}\`

          ${{ steps.scan.outputs.notes }}

          Rules: never merge upstream-sync to main directly. Staging first. Protect Railway volume and Supabase data.
          MSG
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$BODY" || true

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge
        run: echo "Issue received for triage"
