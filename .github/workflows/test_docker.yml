name: Beta Release (Docker)

# This workflow used to run on every push to `main`, which made it a second,
# undocumented deployment channel for open-box.space.
#
# What was observed on 2026-11-01: the gated promotion run `41314770281`
# (14:09:32Z) pinned `hillstreet/open-box:main-7af6579`, and the site served
# `Build at: 2026-11-01 13:19:10` with `Frontend: v4.2.10`. Roughly an hour
# later it served `Build at: 2026-11-01 14:39:56` with `Frontend: v4.2.9`,
# with no promotion run, no redeploy and no `latest` re-point anywhere.
#
# That second image is not on Docker Hub. The `Open-Box Docker Hub` build of
# the same commit logs `frontend version: v4.2.10` on both architectures and
# published only `main-a4f4923`; `latest` still resolves to the 13:47 digest.
# The image that matches is the one this workflow built for that commit: its
# binary job logged `frontend version: edge` at 14:39:28 and its image push
# finished at 14:42:48. The fork's `edge` release is titled "Pre-release
# v4.2.9-5de795c", so a container made from it reports v4.2.9 while really
# serving the fork's rebuilt console chunks — which is exactly what the
# origin now returns for `/assets/manage-CtnRFoSL.js` and
# `/assets/store-LOm5VZiC.js`.
#
# So `ghcr.io/hillstreet-ph/open-box:beta` was moving on every merge, the
# service was following it, and `openbox-deploy.yml` — which resolves tags on
# Docker Hub only — could neither see it nor gate it. Production no longer
# publishes here: the rolling channel is dispatched by hand, and the only path
# to the live site is the promotion gate. Pull-request builds are kept; they
# never pushed anything, because publishing was already gated on the event.
on:
  workflow_dispatch:
    inputs:
      confirm_rolling_publish:
        description: "Publish ghcr.io/<org>/open-box:beta, which any service tracking that tag will pick up"
        required: true
        type: bool
        default: false
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHCR_ORG_NAME: ${{ vars.GHCR_ORG_NAME || 'hillstreet-ph' }}
  IMAGE_NAME: open-box
  REGISTRY: ghcr.io
  ARTIFACT_NAME: 'binaries_docker_release'
  RELEASE_PLATFORMS: 'linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/arm/v6,linux/ppc64le,linux/riscv64,linux/loong64' ### Temporarily disable Docker builds for linux/s390x architectures for unknown reasons.
  IMAGE_PUSH: ${{ github.event.inputs.confirm_rolling_publish == 'true' }}
  IMAGE_TAGS_BETA: |
    type=ref,event=pr
    type=raw,value=beta,enable={{is_default_branch}}

jobs:
  build_binary:
    name: Build Binaries for Docker Release (Beta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'

      - name: Cache Musl
        id: cache-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/musl-libs
          key: docker-musl-libs-v2

      - name: Download Musl Library
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: bash build.sh prepare docker-multiplatform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build go binary (beta)
        run: bash build.sh beta docker-multiplatform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            build/
            !build/*.tgz
            !build/musl-libs/**

  release_docker:
    needs: build_binary
    name: Release Docker image (Beta)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: ["latest", "ffmpeg", "aria2", "aio"]
        include:
          - image: "latest"
            base_image_tag: "base"
            build_arg: ""
            tag_favor: ""
          - image: "ffmpeg"
            base_image_tag: "ffmpeg"
            build_arg: INSTALL_FFMPEG=true
            tag_favor: "suffix=-ffmpeg,onlatest=true"
          - image: "aria2"
            base_image_tag: "aria2"
            build_arg: INSTALL_ARIA2=true
            tag_favor: "suffix=-aria2,onlatest=true"
          - image: "aio"
            base_image_tag: "aio"
            build_arg: |
              INSTALL_FFMPEG=true
              INSTALL_ARIA2=true
            tag_favor: "suffix=-aio,onlatest=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 'build/'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        if: env.IMAGE_PUSH == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS_BETA }}
          flavor: |
            ${{ matrix.tag_favor }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          push: ${{ env.IMAGE_PUSH == 'true' }}
          build-args: |
            BASE_IMAGE_TAG=${{ matrix.base_image_tag }}
            FRONTEND_REPO=${{ vars.FRONTEND_REPO || 'OpenListTeam/OpenList-Frontend' }}
            ${{ matrix.build_arg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.RELEASE_PLATFORMS }}
