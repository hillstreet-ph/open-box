name: Open-Box Backup Supabase

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF is required"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          canonical_ref = "huadtiuuoiriqrjpjxhr"
          project_ref = os.environ["SUPABASE_PROJECT_REF"].strip()
          dsn = os.environ["SUPABASE_DB_URL"].strip()
          if dsn.count("@") != 1:
              raise SystemExit("::error::SUPABASE_DB_URL contains ambiguous connection authority")
          if "#" in dsn:
              raise SystemExit("::error::SUPABASE_DB_URL must not contain a fragment delimiter")
          parsed = urlparse(dsn)
          username = unquote(parsed.username or "")
          database_path = parsed.path

          if project_ref != canonical_ref:
              raise SystemExit("::error::SUPABASE_PROJECT_REF is not the canonical Open-Box project")
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("::error::SUPABASE_DB_URL must be a PostgreSQL connection URI")
          if not parsed.hostname or not database_path:
              raise SystemExit("::error::SUPABASE_DB_URL must include a remote host and database")
          if parsed.query or parsed.params or parsed.fragment:
              raise SystemExit("::error::SUPABASE_DB_URL must not contain target-overriding URI parameters")
          if database_path != "/postgres":
              raise SystemExit("::error::SUPABASE_DB_URL must target the canonical postgres database")

          direct_host = f"db.{canonical_ref}.supabase.co"
          is_direct = parsed.hostname == direct_host and username == "postgres"
          is_pooler = parsed.hostname.endswith(".pooler.supabase.com") and username == f"postgres.{canonical_ref}"
          if not (is_direct or is_pooler):
              raise SystemExit("::error::SUPABASE_DB_URL is not an approved canonical Open-Box direct or pooler URI")
          print("Supabase backup connection reference validated")
          PY

      # The client version, the schema scope and the proof that the archive is
      # not empty all live in one script shared with the maintenance job,
      # because the two copies had drifted and both were producing nothing.
      - name: Dump and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/openbox-db-backup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openbox-db-backup
          path: |
            *.sql.gz
            *.manifest.json
          retention-days: 14

      - name: Ensure bucket + upload
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # A bucket that already exists is success. Storage says so with HTTP
          # 400 carrying a 409/"BucketAlreadyExists" body, so the transport code
          # alone is not the answer — the body has to say which error it was.
          code=$(curl -sS -o /tmp/bucket.json -w "%{http_code}" -X POST "https://${REF}.supabase.co/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"open-box-backups","name":"open-box-backups","public":false}')
          if grep -q 'BucketAlreadyExists' /tmp/bucket.json 2>/dev/null; then
            echo "bucket already exists (HTTP $code)"
          elif [ "${code#2}" != "$code" ]; then
            echo "bucket ready (HTTP $code)"
          else
            echo "::error::bucket step returned $code: $(cat /tmp/bucket.json)"
            exit 1
          fi

          code=$(curl -sS -o /tmp/upload.json -w "%{http_code}" -X POST "https://${REF}.supabase.co/storage/v1/object/open-box-backups/${FILE}" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${FILE}")
          case "$code" in
            2??) echo "archive stored: $(cat /tmp/upload.json)" ;;
            *) echo "::error::archive upload returned $code: $(cat /tmp/upload.json)"; exit 1 ;;
          esac

          # The manifest goes next to the archive, not into openbox_backup_manifest.
          # The run that proved this job listed production's Open-Box tables as ten
          # x_* rows in public with no openbox_* table at all, and no Go code reads
          # that name — it is a legacy assumption left over from
          # supabase/migrations, so writing a row there could never have worked.
          jq -n \
            --arg backup_id "$FILE" \
            --arg location "supabase://open-box-backups/$FILE" \
            --arg checksum "sha256:$CHECKSUM" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{backup_id:$backup_id,kind:"postgresql",location:$location,checksum:$checksum,created_at:$created_at,verification_status:"verified"}]' \
            > "${FILE}.manifest.json"
          code=$(curl -sS -o /tmp/manifest.json -w "%{http_code}" -X POST "https://${REF}.supabase.co/storage/v1/object/open-box-backups/${FILE}.manifest.json" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${FILE}.manifest.json")
          case "$code" in
            2??) echo "manifest stored alongside the archive" ;;
            *) echo "::error::manifest upload returned $code: $(cat /tmp/manifest.json)"; exit 1 ;;
          esac
          cat "${FILE}.manifest.json"
